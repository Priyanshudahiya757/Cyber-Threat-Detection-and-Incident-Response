services:
  mongo:
    image: mongo:7
    container_name: siem-mongo
    restart: unless-stopped
    # Databases run without authentication, so they are published on
    # localhost only — never on the machine's network interfaces.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: siem-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional, for inspecting Elasticsearch indices by hand. Not started by
  # default; run `docker compose --profile tools up -d` to include it.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: siem-kibana
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: siem-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - ELASTIC_HOST=http://elasticsearch:9200
      - APP_ENV=production
      - DEBUG=false
      - ML_MODEL_DIR=/app/ml/models
    # Published for the interactive API docs (http://localhost:8000/docs).
    # The web app itself reaches the API through the frontend's /api proxy.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/datasets:/ml/datasets:ro
      - ./elasticsearch:/elasticsearch:ro
      - ./sample_logs:/sample_logs:ro
    depends_on:
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: siem-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  es_data:
